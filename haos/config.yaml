name: Powerline2MQTT (experimental)
version: "0.1.0-rc.2"
slug: powerline2mqtt
description: Local HomePlug monitoring via MQTT
url: https://github.com/ChristophKomenda/powerline2mqtt
arch: [aarch64, amd64]
startup: application
boot: manual
init: false
host_network: true
privileged: [NET_RAW]
stage: experimental
options:
  node_id: haos
  plc_interface: eth0
  poll_interval: 60
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: false
  discovery_prefix: homeassistant
schema:
  node_id: str
  plc_interface: str
  poll_interval: int(10,3600)
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_tls: bool
  discovery_prefix: str
